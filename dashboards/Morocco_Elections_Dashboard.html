function deltaBars(rows){                           // rows: {label, d, tip}
  if(!rows.length) return `<p class="na">No party changes seats under this rule.</p>`;
  const W=720, L=64, rh=28, H=rows.length*rh+16, m=Math.max(...rows.map(r=>Math.abs(r.d)),4), mid=L+(W-L-40)/2, k=((W-L-40)/2-34)/m;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Seat change by party">`;
  s+=`<line class="axis" x1="${mid}" x2="${mid}" y1="2" y2="${H-6}"/>`;
  rows.forEach((r,i)=>{const y=8+i*rh, w=Math.abs(r.d)*k, pos=r.d>0;
    s+=`<g class="row"${tipAttr(r.tip)}><rect class="hit" x="0" y="${y-4}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-10}" y="${y+13}" text-anchor="end">${esc(r.label)}</text>
    <rect class="hl" x="${pos?mid+1:mid-w-1}" y="${y}" width="${w}" height="16" rx="3" fill="${pos?"var(--teal)":"var(--plum)"}"/>
    <text class="val" x="${pos?mid+w+7:mid-w-7}" y="${y+13}" text-anchor="${pos?"start":"end"}">${sgn(r.d)}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--teal)"></i>gains seats</span><span><i style="background:var(--plum)"></i>loses seats</span></div>`;
}
function scatter(pts, color, xl, yl){               // pts: {x,y,r,tip}
  const W=720,H=380,L=52,B=44,T=12,R=16, xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.floor(Math.min(...xs)*10)/10, x1=Math.ceil(Math.max(...xs)*10)/10, y0=Math.floor(Math.min(...ys)*10)/10, y1=Math.ceil(Math.max(...ys)*10)/10;
  const X=v=>L+(W-L-R)*(v-x0)/(x1-x0), Y=v=>H-B-(H-B-T)*(v-y0)/(y1-y0);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yl)} against ${esc(xl)}, one dot per constituency">`;
  for(let t=x0;t<=x1+1e-9;t+=.1) s+=`<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H-B}"/><text x="${X(t)}" y="${H-B+16}" text-anchor="middle">${Math.round(t*100)}%</text>`;
  for(let t=y0;t<=y1+1e-9;t+=.1) s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${Math.round(t*100)}%</text>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">${xl}</text><text transform="translate(13 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${yl}</text>`;
  pts.slice().sort((a,b)=>b.r-a.r).forEach(p=>{s+=`<circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="${3+p.r*1.3}" fill="${color}" opacity=".6" stroke="var(--surface)" stroke-width="1.5"${tipAttr(p.tip)}/>`});
  return s+`</svg>`;
}
function simpleBars(rows, color, fmt, opt={}){      // rows: {label, v, tip, c}
  const W=opt.W||720, L=opt.L||170, R=70, rh=opt.rh||28, H=rows.length*rh+10, max=(opt.max||Math.max(...rows.map(r=>r.v||0)))*1.02||1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||"Bar chart")}">`;
  rows.forEach((r,i)=>{const y=6+i*rh, w=r.v==null?0:Math.max(1,(W-L-R)*r.v/max);
    s+=`<g class="row"${tipAttr(r.tip||`<b>${esc(r.label)}</b>${fmt(r.v)}`)}><rect class="hit" x="0" y="${y-4}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-10}" y="${y+13}" text-anchor="end">${esc(r.label)}</text>
    <rect class="hl" x="${L}" y="${y}" width="${w}" height="16" rx="3" fill="${r.c||color}"/>
    <text class="val" x="${L+w+7}" y="${y+13}">${fmt(r.v)}</text></g>`});
  return s+`</svg>`;
}
function groupedBars(groups, series, colors, fmt, max){   // groups: {label, vals:[...]}
  const W=720, L=150, R=60, bh=11, gap=2, gh=series.length*(bh+gap)+14, H=groups.length*gh+8; max=max||Math.max(...groups.flatMap(g=>g.vals.map(v=>v||0)))*1.05;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grouped bar chart">`;
  groups.forEach((g,i)=>{const y0=6+i*gh;
    s+=`<text class="lbl" x="${L-10}" y="${y0+gh/2-2}" text-anchor="end">${esc(g.label)}</text>`;
    g.vals.forEach((v,j)=>{const y=y0+j*(bh+gap), w=v==null?0:Math.max(1,(W-L-R)*v/max);
      s+=`<g class="row"${tipAttr(`<b>${esc(g.label)}</b>${esc(series[j])}: ${fmt(v)}`)}><rect class="hit" x="${L}" y="${y-1}" width="${W-L}" height="${bh+gap}"/><rect class="hl" x="${L}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${colors[j]}"/><text class="val" x="${L+w+6}" y="${y+10}">${v==null?"":fmt(v)}</text></g>`})});
  return s+`</svg><div class="legend">${series.map((n,j)=>`<span><i style="background:${colors[j]}"></i>${n}</span>`).join("")}</div>`;
}
function forest(rows, color){                       // rows: {label, or, lo, hi}
  const W=720, L=280, R=70, rh=28, H=rows.length*rh+40, lo=.25, hi=12, X=v=>L+(W-L-R)*(Math.log(Math.min(Math.max(v,lo),hi))-Math.log(lo))/(Math.log(hi)-Math.log(lo));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Odds ratios of voting with 95% confidence intervals">`;
  [.25,.5,1,2,4,8].forEach(t=>{s+=`<line class="${t===1?"axis":"grid"}" x1="${X(t)}" x2="${X(t)}" y1="4" y2="${H-30}"/><text x="${X(t)}" y="${H-14}" text-anchor="middle">${t}×</text>`});
  rows.forEach((r,i)=>{const y=16+i*rh, sig=r.lo>1||r.hi<1;
    s+=`<g class="row"${tipAttr(`<b>${esc(r.label)}</b>Odds ratio ${r.or} (95% CI ${r.lo}–${r.hi})<br>${sig?(r.or>1?"More likely to vote":"Less likely to vote"):"No clear difference"}`)}><rect class="hit" x="0" y="${y-12}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-12}" y="${y+4}" text-anchor="end">${esc(r.label)}</text>
    <line x1="${X(r.lo)}" x2="${X(r.hi)}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="2"/>
    <circle class="hl" cx="${X(r.or)}" cy="${y}" r="5" fill="${sig?color:"var(--surface)"}" stroke="${color}" stroke-width="2"/>
    <text class="val" x="${W-R+10}" y="${y+4}">${r.or.toFixed(2)}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:${color};border-radius:50%"></i>clearly different from 1</span><span><i style="background:var(--surface);border:2px solid ${color};border-radius:50%"></i>interval includes 1</span></div>`;
}
function dumbbell(rows){                            // rows: {label, a, b, tip}; a = 2016 rule (teal), b = 2021 rule (plum)
  const W=720, L=70, R=56, rh=34, H=rows.length*rh+40, max=Math.ceil(Math.max(...rows.flatMap(r=>[r.a,r.b]))/20)*20, X=v=>L+(W-L-R)*v/max;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Local seats by party under the 2016 rule and the 2021 rule">`;
  for(let v=0;v<=max;v+=20) s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="6" y2="${H-30}"/><text x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text>`;
  rows.forEach((r,i)=>{const y=22+i*rh, d=r.b-r.a;
    s+=`<g class="row"${tipAttr(r.tip)}><rect class="hit" x="0" y="${y-rh/2}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-12}" y="${y+4}" text-anchor="end">${esc(r.label)}</text>
    <line x1="${X(r.a)}" x2="${X(r.b)}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-width="2"/>
    <circle class="hl" cx="${X(r.a)}" cy="${y}" r="7" fill="var(--teal)" stroke="var(--bg)" stroke-width="2"/>
    <circle class="hl" cx="${X(r.b)}" cy="${y}" r="7" fill="var(--plum)" stroke="var(--bg)" stroke-width="2"/>
    ${d?`<text class="val" x="${X(Math.max(r.a,r.b))+14}" y="${y+4}">${sgn(d)}</text>`:""}</g>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--teal);border-radius:50%"></i>2016 rule: 3% threshold, quotient on votes</span><span><i style="background:var(--plum);border-radius:50%"></i>2021 rule: no threshold, quotient on registered voters</span></div>`;
}
function drawSameVotes(){const y=document.getElementById("svyear").value, rows=D.same_votes[y].filter(r=>r.seats_2016_rule>=3||r.seats_2021_rule>=3), lead=rows[0], moved=D.same_votes[y].reduce((s,r)=>s+Math.max(r.change,0),0), real=y==="2021"?"2021":"2016";
  document.getElementById("svfig").innerHTML=dumbbell(rows.map(r=>({label:r.party,a:r.seats_2016_rule,b:r.seats_2021_rule,tip:`<b>${r.party}</b>${r.seats_2016_rule} local seats under the 2016 rule<br>${r.seats_2021_rule} under the 2021 rule (${sgn(r.change)})`})))+`<figcaption>Same ${y} votes, two legal regimes. Parties with at least 3 seats under either rule.</figcaption>`;
  document.getElementById("svfinding").innerHTML=lead.change<0
   ?y==="2021"?`<strong>The 2021 rule cost the 2021 winner ${Math.abs(lead.change)} seats</strong>Under the 2016 rule the same votes would have given ${lead.party} ${lead.seats_2016_rule} local seats; under the rule actually in force it won ${lead.seats_2021_rule}. ${moved} seats change hands between the two rules.`
   :`<strong>The 2021 rule alone would have cost the ${y} winner ${Math.abs(lead.change)} seats</strong>Counting the ${y} votes under the 2021 rule takes ${lead.party} from ${lead.seats_2016_rule} to ${lead.seats_2021_rule} local seats and spreads them across the others; ${moved} seats change hands in all. No voter changed their mind; the law did the work.`
   :`<strong>${moved} seats change hands between the two rules</strong>With the ${y} votes, ${lead.party} has ${lead.seats_2016_rule} local seats under the 2016 rule and ${lead.seats_2021_rule} under the 2021 rule.`;}
function heatCell(v){ if(v==null) return `<td class="num na">n/a</td>`; const a=Math.min(Math.abs(v),.7)/.7*.55; return `<td class="num" style="background:rgba(var(${v>=0?"--gain-bg":"--loss-bg"}),${a.toFixed(2)})">${v>0?"+":v<0?"−":""}${Math.abs(v).toFixed(2)}</td>`; }
const scFmt = (kpi,v) => v==null ? "n/a" : /share|turnout/i.test(kpi) ? pct(v) : /Parties/.test(kpi) ? num(v) : num(v,2);
const TERM = {"age_group_30-44":"Age 30–44 (vs 18–29)","age_group_45-59":"Age 45–59 (vs 18–29)","age_group_60+":"Age 60+ (vs 18–29)","education_No schooling":"No schooling (vs higher education)","education_Primary":"Primary (vs higher education)","education_Secondary":"Secondary (vs higher education)","female":"Woman (vs man)","urban":"Urban (vs rural)","income_low":"Income does not cover expenses","trust_parliament":"Trusts parliament"};
const GRP = {age_group:["Age",g=>g],female:["Sex",g=>+g?"Women":"Men"],education:["Education",g=>g],urban:["Area",g=>+g?"Urban":"Rural"],trust_parliament:["Trust in parliament",g=>+g?"Trusts":"Does not trust"]};

function yearTab(y){
  const k=byYear(D.kpi,y), f=byYear(D.forensics,y), cs=D.census_summary[y], rule=D.rules.find(r=>r.year===y), seats=D.seats[y], color=YC[y];
  const pw=D.power.find(p=>p.year===y), gm=D.gamson.find(g=>g.government===GOV[y]), rs=D.regsrc[y], C=D.const[y];
  const second=seats[1], est=rs.source!=="TAFRA";
  let h=`<div class="yearhead"><span class="yr">${y}</span><div><h2 style="border:0;margin:0;padding:0">${k.winner} comes first with ${pct(k.winner_seat_share)} of local seats</h2>
  <span class="pill">Rule: ${rule.threshold?pct(rule.threshold,0)+" threshold":"no threshold"}, quotient on ${rule.quota_basis==="registered"?"registered voters":"votes of eligible lists"}</span> <span class="pill">305 local seats modelled</span></div></div>`;
  h+=tiles([[k.winner,"largest party",`${seats[0].seats_local} local seats; ${second.party} second with ${second.seats_local}`],
    [pct(k.turnout_registered),"turnout of registered voters",est?"registered voters estimated":"registered voters from TAFRA"],
    [pct(cs.real_turnout_national),"real turnout, share of adults (18+)","2014 census population"],
    [num(k.ENP_seats,2),"effective number of parties (seats)",`${k.parties_with_seats} parties win seats`],
    [num(k.gallagher,2),"Gallagher index (seat–vote distortion)","5 or less counts as low"],
    [k.min_parties_majority,"parties needed for a majority","largest parties added until 198 of 395"]]);
  if(est) h+=`<div class="note"><b>Registered voters are estimated for ${y}.</b> The results file gives them for 2011 only. Here they are valid votes ÷ turnout rate, rescaled to the official national total (${num(rs.registered)}). Turnout, registration and the seat quotient depend on this.</div>`;

  /* votes vs seats */
  const shown=seats.filter(s=>s.seats_local>0||s.vote_share>=.02);
  h+=`<h2>Votes and seats</h2><p>Each party's share of valid votes against its share of the 305 local seats. A longer coloured bar means the system rewards the party.</p>
  <figure>${pairedBars(shown.map(s=>({label:s.party,a:s.vote_share,b:s.seat_share,vb:`${s.seats_local} seats`,tip:`<b>${s.party}</b>${num(s.votes)} votes (${pct(s.vote_share)})<br>${s.seats_local} local seats (${pct(s.seat_share)})<br>Seat bonus: ${(s.seat_share-s.vote_share>=0?"+":"−")+Math.abs((s.seat_share-s.vote_share)*100).toFixed(1)} pts`})),color,"Share of votes","Share of local seats")}
  <figcaption>Simulated from constituency votes with the rule in force; national and regional lists are not modelled.</figcaption></figure>`;

  /* engineering */
  h+=`<h2>Same votes, different rules</h2><p>The ${y} votes recounted under another electoral rule. Nobody changes their vote; only the law changes.</p>
  <div class="ctrl"><label for="rule-${y}">Compare the rule in force with</label><select id="rule-${y}" data-year="${y}" class="rulesel">${D.regimes.map((r,i)=>i===IN_FORCE[y]?"":`<option value="${i}"${i===(y==="2021"?1:2)?" selected":""}>${esc(r)}</option>`).join("")}</select></div>
  <figure id="eng-${y}"></figure>
  <details><summary>Seats under every rule (table)</summary><div class="scroll"><table><thead><tr><th>Party</th>${D.regimes.map((r,i)=>`<th class="num">${esc(r)}${i===IN_FORCE[y]?" <small>(in force)</small>":""}</th>`).join("")}</tr></thead><tbody>
  ${D.eng[y].filter(r=>D.regimes.some(g=>r[g]>0)).sort((a,b)=>b[D.regimes[IN_FORCE[y]]]-a[D.regimes[IN_FORCE[y]]]).map(r=>`<tr><td>${r.party}</td>${D.regimes.map(g=>{const d=r[g]-r[D.regimes[IN_FORCE[y]]];return `<td class="num">${r[g]}${d?` <small class="${d>0?"ok":"ko"}">(${sgn(d)})</small>`:""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div></details>`;

  /* constituencies */
  const close=C.filter(c=>c.last_seat_margin_pct!=null&&c.last_seat_margin_pct<1).length, med=C.map(c=>c.last_seat_margin_pct).filter(v=>v!=null).sort((a,b)=>a-b);
  h+=`<h2>The 92 constituencies</h2>`+tiles([[num((med[Math.floor((med.length-1)/2)]+med[Math.ceil((med.length-1)/2)])/2,2)+" pts","median margin for the last seat","gap between last elected and best loser"],
    [pct(close/C.length,0),"of constituencies decided by under 1 point"],
    [(f.fingerprint_rho>0?"+":"−")+Math.abs(f.fingerprint_rho).toFixed(2),"link between turnout and winner's share","strongly positive would be a warning sign"],
    [pct(f.share_turnout_gt_80pct),"of constituencies with turnout above 80%",f["turnout_outliers_|z|>2.5"]?"Outliers: "+f["turnout_outliers_|z|>2.5"]:"no turnout outliers"]]);
  h+=`<figure>${scatter(C.filter(c=>c.turnout!=null).map(c=>({x:c.turnout,y:c.top_share,r:c.seats,tip:`<b>${esc(c.circonscription)}</b>${c.seats} seats · first: ${c.top_party} (${pct(c.top_share)})<br>Turnout ${pct(c.turnout)}<br>Last-seat margin ${num(c.last_seat_margin_pct,2)} pts`})),color,"Turnout (registered voters)","Vote share of the leading party")}
  <figcaption>One dot per constituency, sized by seats. Hover for detail. These are signals, not proof.</figcaption></figure>
  <div class="ctrl"><input type="search" placeholder="Filter constituencies or parties…" aria-label="Filter constituencies" class="cfilter" data-year="${y}"><span id="ccount-${y}"></span></div>
  <div class="scroll tall"><table class="ctable" data-year="${y}"><thead><tr><th data-sort="circonscription">Constituency</th><th data-sort="seats" class="num">Seats</th><th data-sort="registered" class="num">Registered</th><th data-sort="turnout" class="num">Turnout</th><th data-sort="top_party">First party</th><th data-sort="top_share" class="num">Its share</th><th data-sort="ENP_votes" class="num">Eff. parties</th><th data-sort="last_seat_margin_pct" class="num">Last-seat margin</th></tr></thead><tbody></tbody></table></div>`;

  /* territory */
  const P=D.prov[y].filter(p=>p.pop_per_seat!=null).sort((a,b)=>b.pop_per_seat-a.pop_per_seat), ends=[...P.slice(0,6),...P.slice(-6)];
  h+=`<h2>Whose vote weighs more</h2>`+tiles([[num(cs.MAL_index_pct,1)+"%","malapportionment index","share of seats not where the population is"],
    [num(cs.vote_weight_ratio_max_min,0)+"×","gap between the most and least populated seat"],
    [pct(cs.registration_rate_national),"of adults are registered",est?"estimate":""]]);
  h+=`<figure>${simpleBars(ends.map((p,i)=>({label:p.province,v:p.pop_per_seat,c:i<6?"var(--neutral)":color,tip:`<b>${esc(p.province)}</b>${num(p.population)} inhabitants · ${p.seats} seats<br>${num(p.pop_per_seat)} inhabitants per seat<br>${pct(p.urban_rate,0)} urban`})),color,v=>num(v),{aria:"Inhabitants per seat, six least and six most represented provinces"})}
  <div class="legend"><span><i style="background:var(--neutral)"></i>six least represented provinces</span><span><i style="background:${color}"></i>six most represented</span></div>
  <figcaption>Inhabitants per local seat (2014 census). The fewer inhabitants per seat, the more each vote weighs.</figcaption></figure>`;
  const prof=D.profile[y].filter(r=>seats.find(s=>s.party===r.party&&s.seats_local>=5));
  h+=`<h3>Where each party is strong</h3><p>Correlation between a party's vote share and three census indicators, across provinces. This describes places, not individual voters.</p>
  <div class="scroll"><table style="min-width:0"><thead><tr><th>Party</th><th class="num">Urbanisation</th><th class="num">Illiteracy</th><th class="num">Unemployment</th></tr></thead><tbody>${prof.sort((a,b)=>b.urban_rate-a.urban_rate).map(r=>`<tr><td>${r.party}</td>${heatCell(r.urban_rate)}${heatCell(r.illiteracy)}${heatCell(r.unemployment)}</tr>`).join("")}</tbody></table></div>`;

  /* survey */
  h+=`<h2>Who voted</h2>`;
  const ws=WAVES_FOR[y];
  if(!ws.length) h+=`<div class="note"><b>No survey covers the 2016 election.</b> Arab Barometer Wave IV was in the field in May–June 2016, before the October vote, so its voting question refers to 2011. Wave V (2018–2019) would fill this gap.</div>`;
  else{
    h+=`<p>Arab Barometer respondents in Morocco asked whether they voted in the ${y} election. People say they voted more often than they did, so compare groups rather than levels. Unweighted.</p>`;
    if(ws.length>1) h+=`<div class="ctrl"><label for="wave-${y}">Survey</label><select id="wave-${y}" class="wavesel" data-year="${y}">${ws.map(w=>`<option value="${w}">${WAVE_NAME[w]}</option>`).join("")}</select></div>`;
    h+=`<div id="survey-${y}"></div>`;
  }

  /* government */
  h+=`<h2>The government that followed: ${GOV[y]}</h2>`+tiles([[pw.formation_days+" days","from election to government"],
    [pw.coalition_seats,"coalition seats out of 395",`winner holds ${pct(pw.winner_share_of_coalition,0)} of them`],
    [pw.gamson_ratio==null?"to collect":num(pw.gamson_ratio,2),"Gamson ratio of the winner","1 = posts in proportion to seats"],
    [`${pw.sov_nonpartisan} of 6`,"sovereignty ministries held by non-partisans",`${pw.sov_winner} held by the winning party`]]);
  const pf=D.portfolios.filter(p=>p.government===GOV[y]);
  h+=`<figure>${simpleBars(pf.map(p=>({label:p.party,v:p.members,c:p.party==="Non-partisan"?"var(--neutral)":color,tip:`<b>${p.party}</b>${p.members} members of government<br>${p.sovereignty} sovereignty ministries`})),color,v=>num(v),{L:130,aria:"Members of government by party"})}
  <figcaption>Members of government by party (hand-coded in the notebook). Weighted Gamson ratio: ${num(gm.gamson_weighted,2)}, indicative only because the ranking of portfolios is still a placeholder.</figcaption></figure>`;

  /* scorecard */
  h+=`<h2>Scorecard</h2><div class="scroll"><table><thead><tr><th>Test</th><th>KPI</th><th>Benchmark</th><th class="num">${y}</th><th>Result</th></tr></thead><tbody>${D.scorecard.filter(s=>s.year===y).map(s=>`<tr><td>${s.test}</td><td>${s.kpi}</td><td>${esc(s.benchmark)}</td><td class="num">${scFmt(s.kpi,s.value)}</td><td>${s.value==null?'<span class="na">n/a</span>':s.meets_benchmark?'<span class="ok">● meets</span>':'<span class="ko">○ falls short</span>'}</td></tr>`).join("")}</tbody></table></div>
  <p class="na" style="font-size:14px">Benchmarks are analytical conventions, not universal norms.</p>`;
  return h;
}

  document.getElementById("eng-"+y).innerHTML=deltaBars(rows)+`<figcaption><b>${moved} of 305 local seats change hands</b> when the ${y} votes are counted with “${esc(b)}” instead of the rule in force.</figcaption>`;
}
function drawSurvey(y){
  const sel=document.getElementById("wave-"+y), w=sel?sel.value:WAVES_FOR[y][0], n=D.survey_n[w], h2=D.h2.find(r=>r.wave===w), c=YC[y];
  let h=tiles([[pct(n.turnout,0),"say they voted",`${num(n.n_vote)} eligible respondents of ${num(n.n)}`],
    [pct(h2.trust_voters,0)+" vs "+pct(h2.trust_non_voters,0),"trust parliament: voters vs non-voters",`gap of ${(h2.trust_gap*100).toFixed(0)} points`],
    [(h2.youth_gap_60plus_minus_18_29*100).toFixed(0)+" pts","turnout gap, 60+ vs 18–29"]]);
  const groups=Object.keys(GRP).flatMap(v=>D.turnout_groups.filter(r=>r.variable===v).map(r=>({label:GRP[v][0]+": "+GRP[v][1](r.group),v:r[w]})));
  h+=`<div class="twocol"><figure><h3>Reported turnout by group</h3>${simpleBars(groups,c,v=>pct(v,0),{W:520,L:210,rh:24,max:.8,aria:"Reported turnout by group"})}</figure>
  <figure><h3>What changes the odds of voting</h3>${forest(D.logit[w].filter(r=>TERM[r.term]).map(r=>({label:TERM[r.term],or:r.odds_ratio,lo:r.ci_low,hi:r.ci_high})),c)}<figcaption>Odds ratios from a logistic regression, each trait holding the others constant. Right of 1× means more likely to vote.</figcaption></figure></div>
  <p class="na" style="font-size:14px">${WAVE_NAME[w]}. Respondents too young to vote in ${y} are excluded. Verdict on “abstention goes with distrust”: ${h2.H2_verdict}.</p>`;
  document.getElementById("survey-"+y).innerHTML=h;
}
const cstate={};
function drawTable(y){
  const st=cstate[y]||(cstate[y]={key:"circonscription",dir:1,q:""}), q=st.q.toLowerCase();
  let rows=D.const[y].filter(c=>!q||(c.circonscription+" "+c.province+" "+c.top_party).toLowerCase().includes(q));
  rows.sort((a,b)=>{const x=a[st.key],z=b[st.key]; return (x==null)-(z==null)||(typeof x==="string"?x.localeCompare(z):x-z)*st.dir});
  document.querySelector(`.ctable[data-year="${y}"] tbody`).innerHTML=rows.map(c=>`<tr><td>${esc(c.circonscription)}<br><small>${esc(c.province)}</small></td><td class="num">${c.seats}</td><td class="num">${num(c.registered)}</td><td class="num">${pct(c.turnout)}</td><td>${c.top_party}</td><td class="num">${pct(c.top_share)}</td><td class="num">${num(c.ENP_votes,1)}</td><td class="num">${num(c.last_seat_margin_pct,2)} pts</td></tr>`).join("");
  document.getElementById("ccount-"+y).textContent=`${rows.length} of ${D.const[y].length} constituencies`;
}

/* ---------- overview ---------- */
const METRICS=[["turnout_registered","Turnout of registered voters",v=>pct(v),"kpi"],["real_turnout_national","Real turnout (share of adults)",v=>pct(v),"cs"],["registration_rate_national","Registration rate (share of adults)",v=>pct(v),"cs"],["winner_seat_share","Winner's share of local seats",v=>pct(v),"kpi"],["ENP_votes","Effective number of parties (votes)",v=>num(v,2),"kpi"],["ENP_seats","Effective number of parties (seats)",v=>num(v,2),"kpi"],["gallagher","Gallagher index",v=>num(v,2),"kpi"],["pedersen_volatility","Pedersen volatility vs previous election",v=>v==null?"n/a":num(v,1),"kpi"],["parties_with_seats","Parties winning seats",v=>num(v),"kpi"],["fingerprint_rho","Turnout–winner link (ρ)",v=>num(v,2),"fo"]];
const mval=(m,y)=>m[3]==="kpi"?byYear(D.kpi,y)[m[0]]:m[3]==="cs"?D.census_summary[y][m[0]]:byYear(D.forensics,y)[m[0]];
function overviewTab(){
  const Y=D.years;
  let h=`<h2 style="border:0;margin-top:32px;padding-top:0">The chain, from voters to powers</h2><p>Each link carries the indicator that measures it and a verdict on how much the vote still decides at that point.</p><ol class="chain">`;
  const nodes=["Voters","Election","Largest party","Head of government","Government"];
  D.chain.forEach((c,i)=>{h+=`<li class="node">${nodes[i]}</li><li class="link s-${c.status}"><span class="status">${c.status}</span><div class="lkpi">${esc(c.kpi)}</div><div class="lval">${esc(c.value)}</div></li>`});
  h+=`<li class="split"><div class="node">Government powers</div><div class="node mon">Monarchy powers</div></li></ol>
  <div class="finding" style="--yc:var(--plum)"><strong>The vote decides who comes first, less what follows</strong>The largest party has led the government each time, but it never reaches 40% of seats, its weight in its own government is below its weight in the coalition, and most sovereignty ministries stay with non-partisan ministers.</div>`;

  h+=`<h2>The three elections side by side</h2><div class="scroll"><table><thead><tr><th>KPI</th>${Y.map(y=>`<th class="num">${y}</th>`).join("")}</tr></thead><tbody>
  <tr><td>Largest party</td>${Y.map(y=>`<td class="num">${byYear(D.kpi,y).winner}</td>`).join("")}</tr>
  ${METRICS.map(m=>`<tr><td>${m[1]}</td>${Y.map(y=>`<td class="num">${m[2](mval(m,y))}</td>`).join("")}</tr>`).join("")}
  <tr><td>Parties needed for a majority</td>${Y.map(y=>`<td class="num">${byYear(D.kpi,y).min_parties_majority}</td>`).join("")}</tr>
  <tr><td>Malapportionment index</td>${Y.map(y=>`<td class="num">${num(D.census_summary[y].MAL_index_pct,1)}%</td>`).join("")}</tr>
  <tr><td>Registered voters</td>${Y.map(y=>`<td class="num">${num(D.regsrc[y].registered)}${D.regsrc[y].source==="TAFRA"?"":" <small>est.</small>"}</td>`).join("")}</tr></tbody></table></div>
  <div class="ctrl"><label for="metric">Chart one KPI</label><select id="metric">${METRICS.map((m,i)=>`<option value="${i}">${m[1]}</option>`).join("")}</select></div><figure id="metricfig"></figure>`;

  const parties=[...new Set(Y.flatMap(y=>D.seats[y].filter(s=>s.seats_local>=10).map(s=>s.party)))];
  const tot=p=>Y.reduce((s,y)=>s+((D.seats[y].find(r=>r.party===p)||{}).seats_local||0),0);
  parties.sort((a,b)=>tot(b)-tot(a));
  h+=`<h2>How the parties moved</h2><p>Local seats won by each party at the three elections (parties with at least 10 seats once).</p>
  <div class="ctrl"><label for="pmeasure">Show</label><select id="pmeasure"><option value="seats_local">Local seats</option><option value="vote_share">Share of votes</option></select></div><figure id="partyfig" data-parties='${JSON.stringify(parties)}'></figure>`;

  h+=`<h2>Same votes, different parliament</h2><p>One election's votes counted under two rules. Each line joins a party's local seats under the 2016 rule and under the 2021 rule.</p>
  <div class="ctrl"><label for="svyear">Votes of</label><select id="svyear">${Y.map(y=>`<option${y==="2016"?" selected":""}>${y}</option>`).join("")}</select></div>
  <figure id="svfig"></figure><div class="finding" id="svfinding" style="--yc:var(--plum)"></div>
  <h3>The largest party under every rule</h3><p>Seats of each year's largest party when that year's votes are counted under each rule.</p><div class="scroll"><table><thead><tr><th>Votes of</th><th>Largest party</th>${D.regimes.map(r=>`<th class="num">${esc(r)}</th>`).join("")}</tr></thead><tbody>
  ${Y.map(y=>{const w=byYear(D.kpi,y).winner, r=D.eng[y].find(e=>e.party===w), base=r[D.regimes[IN_FORCE[y]]];return `<tr><td>${y}</td><td>${w}</td>${D.regimes.map((g,i)=>{const d=r[g]-base;return `<td class="num">${i===IN_FORCE[y]?`<b>${r[g]}</b> <small>in force</small>`:`${r[g]} <small class="${d>0?"ok":d<0?"ko":"na"}">(${sgn(d)})</small>`}</td>`}).join("")}</tr>`}).join("")}</tbody></table></div>`;

  const kp=[...new Set(D.scorecard.map(s=>s.test+"|"+s.kpi+"|"+s.benchmark))];
  h+=`<h2>Scorecard</h2><p>Filled dots meet the benchmark, open dots fall short.</p><div class="scroll"><table><thead><tr><th>Test</th><th>KPI</th><th>Benchmark</th>${Y.map(y=>`<th class="num">${y}</th>`).join("")}</tr></thead><tbody>
  ${kp.map(k=>{const [t,n,b]=k.split("|");return `<tr><td>${t}</td><td>${n}</td><td>${esc(b)}</td>${Y.map(y=>{const s=D.scorecard.find(r=>r.year===y&&r.kpi===n);return s.value==null?`<td class="num na">n/a</td>`:`<td class="num"><span class="${s.meets_benchmark?"ok":"ko"}">${s.meets_benchmark?"●":"○"}</span> ${scFmt(n,s.value)}</td>`}).join("")}</tr>`}).join("")}</tbody></table></div>`;

  const prow=(l,f)=>`<tr><td>${l}</td>${D.power.map(p=>`<td class="num">${f(p,D.gamson.find(g=>g.government===p.government))}</td>`).join("")}</tr>`, tc=v=>v==null?'<span class="na">to collect</span>':v;
  h+=`<h2>After the vote: who gets the government</h2><p>Real data from government lists and royal communiqués. This is the part of the chain that election results alone cannot show.</p><div class="scroll"><table><thead><tr><th>Indicator</th>${D.power.map(p=>`<th class="num">${p.government}<br><small>${p.year} election</small></th>`).join("")}</tr></thead><tbody>
  ${prow("Days from election to government",p=>p.formation_days)}${prow("Coalition seats (of 395)",p=>p.coalition_seats)}${prow("Winner's share of coalition seats",p=>pct(p.winner_share_of_coalition))}
  ${prow("Winner's share of government posts",p=>tc(p.winner_share_of_portfolios==null?null:pct(p.winner_share_of_portfolios)))}${prow("Gamson ratio (1 = proportional)",p=>tc(p.gamson_ratio==null?null:num(p.gamson_ratio,2)))}
  ${prow("Weighted Gamson ratio (indicative)",(p,g)=>num(g.gamson_weighted,2))}${prow("Key ministries held by non-partisans (of 6)",p=>p.sov_nonpartisan)}${prow("Key ministries held by the winner",p=>p.sov_winner)}${prow("Ministers dismissed by the King during the term",p=>tc(p.royal_dismissals))}</tbody></table></div>
  <figure>${groupedBars(D.power.map(p=>({label:p.government,vals:[p.winner_share_of_coalition,p.winner_share_of_portfolios]})),["Winner's share of coalition seats","Winner's share of government posts"],["var(--neutral)","var(--teal)"],v=>pct(v,0),.6)}
  <figcaption>A party treated in proportion to its seats would have two bars of equal length. The Akhannouch post count is still to collect.</figcaption></figure>
  <div class="finding" style="--yc:var(--plum)"><strong>The winner's weight inside its own government fell from ${num(D.power[0].gamson_ratio,2)} to ${num(D.power[1].gamson_ratio,2)}</strong>A Gamson ratio of 1 means a party gets government posts in proportion to its seats. In 2012 the PJD was already under-represented; in 2017 it held ${pct(D.power[1].winner_share_of_coalition,0)} of the coalition's seats but only ${pct(D.power[1].winner_share_of_portfolios,0)} of the posts, after ${D.power[1].formation_days} days of deadlock.</div>`;
  const mins=[...new Set(D.key_ministries.map(m=>m.ministry))], govs=D.power.map(p=>p.government), gy={"Benkirane I":2012,"El Othmani":2017,"Akhannouch":2021};
  h+=`<h3>The key ministries</h3><div class="legend"><span><i style="background:var(--teal)"></i>held by a party</span><span><i style="background:var(--plum)"></i>held by a non-partisan minister</span></div>
  <div class="scroll"><table><thead><tr><th>Ministry</th>${govs.map(g=>`<th>${g} (${gy[g]})</th>`).join("")}</tr></thead><tbody>
  ${mins.map(mn=>`<tr><td><b>${mn}</b></td>${govs.map(g=>{const m=D.key_ministries.find(r=>r.ministry===mn&&r.government===g), np=m.party==="Non-partisan";return `<td><span class="${np?"ko":"ok"}" style="font-weight:400">${np?"○":"●"} ${m.minister} · ${np?"non-partisan":m.party}</span>${m.to_verify?' <small>(verify)</small>':""}</td>`}).join("")}</tr>`).join("")}
  <tr><td>Held by non-partisans</td>${D.key_counts.map(c=>`<td><b>${c.key_nonpartisan} of 6</b></td>`).join("")}</tr></tbody></table></div>
  <p>In 2012, for the only time in this period, parties held Interior, Foreign Affairs and Justice. From 2017 the same non-partisan ministers stayed at Interior, Foreign Affairs, Islamic Affairs and Defence through every change of coalition.</p>`;

  const ages=D.turnout_groups.filter(r=>r.variable==="age_group"), W=Object.keys(D.waves);
  h+=`<h2>Who votes: three surveys</h2><p>Reported turnout by age in the three Arab Barometer waves. Waves III and IV both ask about the 2011 election; Wave VII asks about 2021. No wave covers 2016.</p>
  <figure>${groupedBars(ages.map(a=>({label:"Age "+a.group,vals:W.map(w=>a[w])})),W.map(w=>`${WAVE_NAME[w]} → ${D.waves[w].election} vote`),W.map(w=>WC[w]),v=>pct(v,0),.8)}</figure>
  <div class="scroll"><table><thead><tr><th>Survey</th><th>Election asked about</th><th class="num">Say they voted</th><th class="num">Trust parliament: voters</th><th class="num">Non-voters</th><th class="num">Gap</th><th>“Abstention goes with distrust”</th></tr></thead><tbody>
  ${D.h2.map(r=>`<tr><td>${WAVE_NAME[r.wave]}</td><td>${D.waves[r.wave].election}</td><td class="num">${pct(D.survey_n[r.wave].turnout,0)}</td><td class="num">${pct(r.trust_voters,0)}</td><td class="num">${pct(r.trust_non_voters,0)}</td><td class="num">${(r.trust_gap*100).toFixed(0)} pts</td><td>${r.H2_verdict}</td></tr>`).join("")}</tbody></table></div>`;

  h+=`<h2>Reading these numbers</h2><ul style="max-width:74ch">
  <li><b>Local seats only.</b> The 305 constituency seats are simulated from the votes; the 90 national or regional list seats are not modelled.</li>
  <li><b>Registered voters for 2016 and 2021 are estimates</b>, rescaled to the official national totals. 2011 comes from the results file.</li>
  <li><b>Population is the 2014 census for all three years</b>, so malapportionment is identical across elections and the 2021 registration and real-turnout rates are overstated.</li>
  <li><b>Survey figures are self-reported and unweighted.</b> Registration and reasons for abstaining are not asked in these waves.</li>
  <li><b>Government data is hand-coded.</b> The ranking of portfolios behind the weighted Gamson ratio is a placeholder; four further power measures are still to collect.</li></ul>`;
  return h;
}
function drawMetric(){const m=METRICS[+document.getElementById("metric").value];
  document.getElementById("metricfig").innerHTML=simpleBars(D.years.map(y=>({label:y,v:mval(m,y),c:YC[y]})).map(r=>({...r,tip:`<b>${r.label}</b>${m[1]}: ${m[2](r.v)}`})),"",m[2],{L:60,rh:34,aria:m[1]})+`<figcaption>${m[1]}, by election.</figcaption>`;}
function drawParties(){const key=document.getElementById("pmeasure").value, f=document.getElementById("partyfig"), ps=JSON.parse(f.dataset.parties);
  f.innerHTML=groupedBars(ps.map(p=>({label:p,vals:D.years.map(y=>{const r=D.seats[y].find(s=>s.party===p);return r?r[key]:0})})),D.years,D.years.map(y=>YC[y]),key==="vote_share"?v=>pct(v):v=>num(v));}

/* ---------- shell ---------- */
const TABS=[...D.years.map(y=>({id:y,label:y,sub:byYear(D.kpi,y).winner+" first · "+GOV[y],color:YC[y]})),{id:"overview",label:"Overview",sub:"Compare the three",color:"var(--ink)"}];
document.getElementById("tablist").innerHTML=TABS.map(t=>`<button role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" aria-selected="false" tabindex="-1" style="--tc:${t.color}">${t.label}<small>${t.sub}</small></button>`).join("");
document.getElementById("main").innerHTML=TABS.map(t=>`<section class="tab" role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}" style="--yc:${t.color}">${t.id==="overview"?overviewTab():yearTab(t.id)}</section>`).join("")+`<footer>Sources: TAFRA election results (openAfrica), HCP general census 2014, Arab Barometer waves III, IV and VII, government lists. Computed with the Morocco Elections KPI Toolkit notebook.</footer>`;
function show(id,focus){ if(!TABS.find(t=>t.id===id)) id="overview";
  TABS.forEach(t=>{const on=t.id===id,b=document.getElementById("tab-"+t.id); b.setAttribute("aria-selected",on); b.tabIndex=on?0:-1; document.getElementById("panel-"+t.id).classList.toggle("on",on); if(on&&focus) b.focus();});
  history.replaceState(null,"","#"+id); }
document.getElementById("tablist").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){show(b.id.slice(4)); window.scrollTo({top:document.querySelector(".tabs").offsetTop})}});
document.getElementById("tablist").addEventListener("keydown",e=>{const i=TABS.findIndex(t=>document.getElementById("tab-"+t.id).getAttribute("aria-selected")==="true"); if(e.key==="ArrowRight") show(TABS[(i+1)%TABS.length].id,true); if(e.key==="ArrowLeft") show(TABS[(i+TABS.length-1)%TABS.length].id,true);});
D.years.forEach(y=>{drawEng(y); drawTable(y); if(WAVES_FOR[y].length) drawSurvey(y);});
drawMetric(); drawParties(); drawSameVotes();
document.addEventListener("change",e=>{const t=e.target; if(t.classList.contains("rulesel")) drawEng(t.dataset.year); if(t.classList.contains("wavesel")) drawSurvey(t.dataset.year); if(t.id==="metric") drawMetric(); if(t.id==="pmeasure") drawParties(); if(t.id==="svyear") drawSameVotes();});
document.addEventListener("input",e=>{const t=e.target; if(t.classList.contains("cfilter")){(cstate[t.dataset.year]).q=t.value; drawTable(t.dataset.year);}});
document.addEventListener("click",e=>{const th=e.target.closest("th[data-sort]"); if(!th) return; const y=th.closest("table").dataset.year, st=cstate[y]; st.dir=st.key===th.dataset.sort?-st.dir:1; st.key=th.dataset.sort; drawTable(y);});
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]"); if(!el){tip.style.display="none";return;} tip.innerHTML=el.dataset.tip.replace(/<\/b>/,"</b>"); tip.style.display="block"; const r=tip.getBoundingClientRect(); tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+"px"; tip.style.top=(e.clientY+16+r.height>innerHeight?e.clientY-r.height-12:e.clientY+16)+"px";});
document.addEventListener("pointerleave",()=>tip.style.display="none");
show(location.hash.slice(1)||"overview");
</script></body></html>
