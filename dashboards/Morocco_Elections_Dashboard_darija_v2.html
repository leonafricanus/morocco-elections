function forest(rows, color){                       // rows: {label, or, lo, hi}
  const W=720, L=280, R=70, rh=28, H=rows.length*rh+40, lo=.25, hi=12, X=v=>L+(W-L-R)*(Math.log(Math.min(Math.max(v,lo),hi))-Math.log(lo))/(Math.log(hi)-Math.log(lo));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نسب الحظوظ ديال التصويت مع مجالات الثقة 95%">`;
  [.25,.5,1,2,4,8].forEach(t=>{s+=`<line class="${t===1?"axis":"grid"}" x1="${X(t)}" x2="${X(t)}" y1="4" y2="${H-30}"/><text x="${X(t)}" y="${H-14}" text-anchor="middle">${t}×</text>`});
  rows.forEach((r,i)=>{const y=16+i*rh, sig=r.lo>1||r.hi<1;
    s+=`<g class="row"${tipAttr(`<b>${esc(r.label)}</b>نسبة الحظوظ ${r.or} (مجال الثقة 95%: ${r.lo}–${r.hi})<br>${sig?(r.or>1?"حظوظو باش يصوت أكبر":"حظوظو باش يصوت أقل"):"ما كاينش فرق واضح"}`)}><rect class="hit" x="0" y="${y-12}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-12}" y="${y+4}" text-anchor="end">${RTLi(esc(r.label))}</text>
    <line x1="${X(r.lo)}" x2="${X(r.hi)}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="2"/>
    <circle class="hl" cx="${X(r.or)}" cy="${y}" r="5" fill="${sig?color:"var(--surface)"}" stroke="${color}" stroke-width="2"/>
    <text class="val" x="${W-R+10}" y="${y+4}">${r.or.toFixed(2)}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:${color};border-radius:50%"></i>مختلف بوضوح على 1</span><span><i style="background:var(--surface);border:2px solid ${color};border-radius:50%"></i>المجال فيه 1</span></div>`;
}
function dumbbell(rows){                            // rows: {label, a, b, tip}; a = 2016 rule (teal), b = 2021 rule (plum)
  const W=720, L=70, R=56, rh=34, H=rows.length*rh+40, max=Math.ceil(Math.max(...rows.flatMap(r=>[r.a,r.b]))/20)*20, X=v=>L+(W-L-R)*v/max;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="المقاعد المحلية حسب الحزب بقاعدة 2016 وقاعدة 2021">`;
  for(let v=0;v<=max;v+=20) s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="6" y2="${H-30}"/><text x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text>`;
  rows.forEach((r,i)=>{const y=22+i*rh, d=r.b-r.a;
    s+=`<g class="row"${tipAttr(r.tip)}><rect class="hit" x="0" y="${y-rh/2}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-12}" y="${y+4}" text-anchor="end">${RTLi(esc(r.label))}</text>
    <line x1="${X(r.a)}" x2="${X(r.b)}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-width="2"/>
    <circle class="hl" cx="${X(r.a)}" cy="${y}" r="7" fill="var(--teal)" stroke="var(--bg)" stroke-width="2"/>
    <circle class="hl" cx="${X(r.b)}" cy="${y}" r="7" fill="var(--plum)" stroke="var(--bg)" stroke-width="2"/>
    ${d?`<text class="val" x="${X(Math.max(r.a,r.b))+14}" y="${y+4}">${sgn(d)}</text>`:""}</g>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--teal);border-radius:50%"></i>قاعدة 2016: عتبة 3%، القاسم على الأصوات</span><span><i style="background:var(--plum);border-radius:50%"></i>قاعدة 2021: بلا عتبة، القاسم على المسجلين</span></div>`;
}

/* seat allocation: largest remainder, same logic as the notebook */
function allocate(votes, seats, thr, basis, registered) {
  const valid = Object.values(votes).reduce((a, b) => a + b, 0);
  const el = Object.entries(votes).filter(([, v]) => thr > 0 ? v >= thr * valid : v > 0);
  const out = {}; if (!el.length || seats <= 0) return out;
  const base = basis === "eligible" ? el.reduce((a, [, v]) => a + v, 0) : basis === "valid" ? valid : (registered || valid), q = base / seats;
  let full = el.map(([p, v]) => [p, Math.floor(v / q), v]), sum = full.reduce((a, f) => a + f[1], 0);
  if (sum > seats) { full = full.map(f => [f[0], Math.floor(f[1] * seats / sum), f[2]]); sum = full.reduce((a, f) => a + f[1], 0); }
  full.map(f => [f, f[2] - f[1] * q]).sort((a, b) => b[1] - a[1]).slice(0, seats - sum).forEach(([f]) => f[1]++);
  full.forEach(f => { if (f[1]) out[f[0]] = f[1]; }); return out;
}
const cache = {};
function seatsFor(y, ri, regFn) {

  CV[y].forEach(c => { const a = allocate(c.v, c.seats, REG[ri][0], REG[ri][1], regFn ? regFn(c) : c.reg); by[c.name] = a; for (const p in a) tot[p] = (tot[p] || 0) + a[p]; });
  const r = { by, tot }; if (!regFn) cache[key] = r; return r;
}

/* ---------- hemicycle ---------- */
const HEMI = (() => { const N = 305, rows = 9, r0 = 110, dr = 22, rad = [...Array(rows)].map((_, i) => r0 + i * dr), tot = rad.reduce((a, b) => a + b, 0);
  const n = rad.map(r => Math.round(N * r / tot)); let diff = N - n.reduce((a, b) => a + b, 0);
  for (let i = rows - 1; diff !== 0; i = (i + rows - 1) % rows) { n[i] += Math.sign(diff); diff -= Math.sign(diff); }
  const pts = []; rad.forEach((r, i) => { for (let j = 0; j < n[i]; j++) { const a = Math.PI - Math.PI * (j + .5) / n[i]; pts.push({ x: 360 + r * Math.cos(a), y: 300 - r * Math.sin(a), a }); } });
  return pts.sort((p, q) => q.a - p.a); })();
function hemicycle(tot, label) {

  s += `<text x="360" y="276" text-anchor="middle" style="font:500 40px Newsreader,Georgia,serif;fill:var(--ink)">${label}</text><text x="360" y="298" text-anchor="middle">${esc(pname(g[0][0]))} ${num(g[0][1])} · ${num(g[0][1] / 305 * 100, 1)}%</text></svg>`;
  return s + `<div class="chips">${g.map(([p, n]) => `<span><i style="background:${pc(p)}"></i>${esc(pname(p))} <b>${num(n)}</b></span>`).join("")}</div>`;
}

function provAgg(y) { const o = {}; CV[y].forEach(c => { const p = o[c.prov] || (o[c.prov] = { seats: 0, reg: 0, voters: 0, valid: 0, v: {}, consts: [] }); p.seats += c.seats; p.reg += c.reg; p.voters += c.voters; p.valid += c.valid; p.consts.push(c.name); for (const k in c.v) p.v[k] = (p.v[k] || 0) + c.v[k]; });

/* ---------- turnout what-if (same logic as turnout_whatif in the notebook) ---------- */
function whatIf(y, delta, area, chosen) {
  const tot = {}, ri = IN_FORCE[y]; let voters = 0, touched = 0;
  CV[y].forEach(c => { let v = c.v, vt = c.voters;
    if (delta && (area === "all" || (area === "urban") === !!c.u)) {
      const t0 = c.voters / c.reg, t1 = Math.min(Math.max(t0 + delta / 100, .02), .98);
      const pool = Object.keys(c.v).filter(p => c.v[p] > 0 && (!chosen.size || chosen.has(p) || (chosen.has(OTH) && !PC[p]))), ps = pool.reduce((a, p) => a + c.v[p], 0);
      if (pool.length) { const extra = Math.max(c.reg * (t1 - t0) * (c.valid / c.voters), -ps); v = { ...c.v }; pool.forEach(p => { v[p] += extra * c.v[p] / ps; }); vt += c.reg * (t1 - t0); touched++; } }
    const a = allocate(v, c.seats, REG[ri][0], REG[ri][1], c.reg); for (const p in a) tot[p] = (tot[p] || 0) + a[p]; voters += vt; });
  return { tot, voters, touched };
}
function drawWhat(y) {

  const r = whatIf(y, delta, area, chosen), base = seatsFor(y, IN_FORCE[y]).tot, reg = CV[y].reduce((a, c) => a + c.reg, 0), v0 = CV[y].reduce((a, c) => a + c.voters, 0);

  document.getElementById("whatval-" + y).textContent = (delta > 0 ? "+" : delta < 0 ? "−" : "") + Math.abs(delta) + " " + t("ptsU");
  document.getElementById("whatout-" + y).innerHTML = tiles([[pct(r.voters / reg), t("tTurn"), t("was", { v: pct(v0 / reg) })], [num(r.voters / 1e6, 2) + (AR ? " مليون" : " M"), t("tVot"), t("was", { v: num(v0 / 1e6, 2) + (AR ? " مليون" : " M") })], [pct(r.voters / X.pop18), t("tReal"), t("was", { v: pct(v0 / X.pop18) })], [num(r.touched), t("tTouched")]]) +

}

  <div id="whatout-${y}"></div><p class="na" style="font-size:13.5px">${t("whatNote")}</p>`);
  before(h[2], `<h2>${t("mapH")}</h2><p>${t("mapP")}</p><div class="ctrl"><label for="mapmetric-${y}">${t("show")}</label><select id="mapmetric-${y}" class="x-map" data-year="${y}">${[["lead", "mLead"], ["share", "mShare"], ["turn", "mTurn"], ["real", "mReal"], ["pps", "mPps"]].map(m => `<option value="${m[0]}">${t(m[1])}</option>`).join("")}</select></div><div class="mapwrap"><figure id="map-${y}"></figure><div id="maplg-${y}"></div></div>`);
  drawHemi(y); drawYearMap(y); drawWhat(y);
});
function drawHemi(y) { const i = +document.getElementById("hemirule-" + y).value; document.getElementById("hemi-" + y).innerHTML = hemicycle(seatsFor(y, i).tot, y); }

/* ---------- overview: motion, flow, party ---------- */
const ov = document.getElementById("panel-overview"), oh = ov.querySelectorAll(":scope > h2")[3];
const ohLast = [...ov.querySelectorAll(":scope > h2")].pop();
const RACE = [...MAIN, OTH], rs = Object.fromEntries(Y.map(y => [y, grouped(seatsFor(y, IN_FORCE[y]).tot)])), rmax = Math.max(...Y.flatMap(y => Object.values(rs[y])));
before(oh, `<h2>${t("motionH")}</h2><p>${t("motionP")}</p><div class="ctrl"><button class="btn" id="raceplay">${t("play")}</button>${Y.map(y => `<button class="btn x-raceyear" data-year="${y}" aria-pressed="false">${y}</button>`).join("")}</div>
<div class="twocol"><div><div class="raceyear" id="raceyear"></div><div class="race" id="race" style="height:${RACE.length * 30}px">${RACE.map(p => `<div class="rrow" data-p="${p}"><span class="rlab">${esc(pname(p))}</span><span class="rbar" style="background:${pc(p)}"></span><span class="rval"></span></div>`).join("")}</div></div><figure id="racehemi"></figure></div>
<h2>${t("flowH")}</h2><p>${t("flowP")}</p><figure id="flowfig"></figure>
<h2>${t("partyH")}</h2><p>${t("partyP")}</p><div class="ctrl"><label for="pvparty">${t("party")}</label><select id="pvparty"></select><label for="pvyear">${t("election")}</label><select id="pvyear">${Y.map(y => `<option${y === "2021" ? " selected" : ""}>${y}</option>`).join("")}</select></div><div id="pvout"></div>`);
let raceY = "2011", raceTimer = null;
function setRace(y) { raceY = y; const g = rs[y], order = RACE.slice().sort((a, b) => (g[b] || 0) - (g[a] || 0));
  document.querySelectorAll("#race .rrow").forEach(r => { const p = r.dataset.p, v = g[p] || 0; r.style.top = order.indexOf(p) * 30 + "px"; r.querySelector(".rbar").style.width = `calc((100% - 130px) * ${v / rmax})`; r.querySelector(".rval").textContent = v; });
  document.getElementById("raceyear").textContent = y; document.getElementById("racehemi").innerHTML = hemicycle(seatsFor(y, IN_FORCE[y]).tot, y);
  document.querySelectorAll(".x-raceyear").forEach(b => b.setAttribute("aria-pressed", b.dataset.year === y)); }
function stopRace() { clearInterval(raceTimer); raceTimer = null; document.getElementById("raceplay").textContent = t("play"); }
function playRace() { if (raceTimer) return stopRace(); document.getElementById("raceplay").textContent = t("pause"); if (raceY === "2021") setRace("2011");
  raceTimer = setInterval(() => { const i = Y.indexOf(raceY); if (i >= Y.length - 1) return stopRace(); setRace(Y[i + 1]); if (i + 1 >= Y.length - 1) stopRace(); }, 2000); }

function drawFlow() {
  const W = 720, H = 470, top = 34, gap = 7, nw = 14, xs = [96, 353, 610], k = (H - top - 10 - gap * (RACE.length - 1)) / 305, pos = {};
  let s = `<svg class="chart flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("flowH"))}">`;
  Y.forEach((y, c) => { let yy = top; s += `<text class="fy" x="${xs[c] + nw / 2}" y="20" text-anchor="middle">${y}</text>`; pos[y] = {};
    RACE.forEach(p => { const n = rs[y][p] || 0; pos[y][p] = { y: yy, o: yy, i: yy }; yy += n * k + gap; }); });
  [["2011", "2016", 0], ["2016", "2021", 1]].forEach(([a, b, c]) => { const fl = X.flows[a + "-" + b].slice().sort((p, q) => RACE.indexOf(p[0]) - RACE.indexOf(q[0]) || RACE.indexOf(p[1]) - RACE.indexOf(q[1]));
    const tin = {}; fl.slice().sort((p, q) => RACE.indexOf(p[1]) - RACE.indexOf(q[1]) || RACE.indexOf(p[0]) - RACE.indexOf(q[0])).forEach(f => { tin[f[0] + ">" + f[1]] = pos[b][f[1]].i; pos[b][f[1]].i += f[2] * k; });
    fl.forEach(f => { const h = f[2] * k, y0 = pos[a][f[0]].o, y1 = tin[f[0] + ">" + f[1]], x0 = xs[c] + nw, x1 = xs[c + 1], mx = (x0 + x1) / 2; pos[a][f[0]].o += h;
      s += `<path class="band" d="M${x0},${y0.toFixed(1)}C${mx},${y0.toFixed(1)} ${mx},${y1.toFixed(1)} ${x1},${y1.toFixed(1)}L${x1},${(y1 + h).toFixed(1)}C${mx},${(y1 + h).toFixed(1)} ${mx},${(y0 + h).toFixed(1)} ${x0},${(y0 + h).toFixed(1)}Z" fill="${pc(f[0])}"${tipAttr(`<b>${a} → ${b}</b>` + (f[0] === f[1] ? t("kept", { p: esc(pname(f[0])), n: num(f[2]) }) : t("went", { a: esc(pname(f[0])), b: esc(pname(f[1])), n: num(f[2], f[2] % 1 ? 1 : 0) })))}/>`; }); });
  Y.forEach((y, c) => RACE.forEach(p => { const n = rs[y][p] || 0; if (!n) return; const h = Math.max(n * k, 1.5), yy = pos[y][p].y;
    s += `<rect x="${xs[c]}" y="${yy.toFixed(1)}" width="${nw}" height="${h.toFixed(1)}" rx="2" fill="${pc(p)}"${tipAttr(`<b>${esc(pname(p))} · ${y}</b>${num(n)} ${t("seats")}`)}/>`;
    if (h >= 9) s += c === 0 ? `<text class="lbl" x="${xs[0] - 8}" y="${(yy + h / 2 + 4).toFixed(1)}" text-anchor="end">${esc(pname(p))} ${num(n)}</text>` : c === 2 ? `<text class="lbl" x="${xs[2] + nw + 8}" y="${(yy + h / 2 + 4).toFixed(1)}">${num(n)} ${esc(pname(p))}</text>` : `<text class="val" x="${xs[1] + nw + 5}" y="${(yy + h / 2 + 4).toFixed(1)}" style="paint-order:stroke;stroke:var(--bg);stroke-width:3px">${num(n)}</text>`; }));
  document.getElementById("flowfig").innerHTML = s + `</svg><div class="chips">${RACE.map(p => `<span><i style="background:${pc(p)}"></i>${esc(pname(p))}</span>`).join("")}</div><figcaption>${t("flowCap")}</figcaption>`;
}

const allP = [...new Set(Y.flatMap(y => D.seats[y].filter(s => s.seats_local > 0).map(s => s.party)))].sort((a, b) => (MAIN.indexOf(a) < 0) - (MAIN.indexOf(b) < 0) || MAIN.indexOf(a) - MAIN.indexOf(b) || a.localeCompare(b));
document.getElementById("pvparty").innerHTML = allP.map(p => `<option>${esc(p)}</option>`).join("");
const pshare = (y, p) => Object.fromEntries(Object.entries(PA[y]).filter(([, a]) => a.v[p]).map(([k, a]) => [k, a.v[p] / a.valid]));
function drawParty() {
  const p = document.getElementById("pvparty").value, y = document.getElementById("pvyear").value, col = pc(p);
  let h = tiles(Y.map(yy => { const r = D.seats[yy].find(s => s.party === p), rank = r ? D.seats[yy].findIndex(s => s.party === p) + 1 : null, firsts = CV[yy].filter(c => Object.entries(c.v).sort((a, b) => b[1] - a[1])[0][0] === p).length;
    return r ? [`${num(r.seats_local)} <small style="font-size:15px;color:var(--muted)">${t("pSeats")}</small>`, `${yy} · ${t("rank", { n: rank })}`, `${pct(r.vote_share)} ${t("pShare")} · ${firsts} ${t("pFirst")}`] : ["—", yy, t("absent")]; }));
  const sh = pshare(y, p), prev = Y[Y.indexOf(y) - 1], shp = prev ? pshare(prev, p) : null, list = Object.entries(sh).sort((a, b) => b[1] - a[1]);
  const tbl = (title, rows, f) => `<h4 style="font:600 14px 'Public Sans',Arial,sans-serif;color:var(--muted);margin:14px 0 4px">${title}</h4><table style="min-width:0;width:100%"><tbody>${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${f(r[1])}</td></tr>`).join("") || `<tr><td class="na">—</td></tr>`}</tbody></table>`;
  let side = tbl(t("pTop") + " · " + y, list.slice(0, 6), v => pct(v));
  if (shp) { const ch = Object.keys({ ...sh, ...shp }).map(k => [k, (sh[k] || 0) - (shp[k] || 0)]).sort((a, b) => b[1] - a[1]), f = v => (v > 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + " " + t("pts");
    side += tbl(t("pGain") + " (" + prev + ")", ch.filter(c => c[1] > 0).slice(0, 4), f) + tbl(t("pLoss") + " (" + prev + ")", ch.filter(c => c[1] < 0).slice(-4).reverse(), f); }
  h += `<div class="mapwrap"><figure><div id="pvmap"></div><div id="pvlg"></div><figcaption>${t("pMapCap", { p: esc(p), y })}</figcaption></figure><div>${side}</div></div>`;
  document.getElementById("pvout").innerHTML = h;
  document.getElementById("pvlg").innerHTML = list.length ? drawMap(document.getElementById("pvmap"), y, sh, v => pct(v, 0), false, (k, v) => `<b>${esc(k)}</b>${esc(p)}: ${v == null ? t("absent") : pct(v)}`) : `<p class="na">${t("absent")}</p>`;
}
/* ---------- Morocco in context ---------- */
const REGN = { nord: ["Scandinavia and Nordics", "الدول الاسكندنافية"], weur: ["Western Europe", "أوروبا الغربية"], asia: ["Asia", "آسيا"], nafr: ["North Africa", "شمال إفريقيا"], amer: ["Americas", "الأمريكتين"] };
const REGIME = { F: ["Full democracy", "ديمقراطية كاملة"], W: ["Flawed democracy", "ديمقراطية ناقصة"], H: ["Hybrid regime", "نظام هجين"], A: ["Authoritarian", "نظام سلطوي"] };
const BENCH = [   // region, country [en, ar], election, regime, EIU score, turnout registered, turnout adults, ENPP, Gallagher index
 ["nord", ["Sweden", "السويد"], "2022", "F", 9.39, 84.21, 80.34, 5.18, 0.64], ["nord", ["Finland", "فنلندا"], "2023", "F", 9.30, 68.50, 68.87, 5.56, 3.99],
 ["weur", ["Germany", "ألمانيا"], "2025", "F", 8.73, 82.54, 82.12, 5.11, 6.49], ["weur", ["France", "فرنسا"], "2024", "W", 7.99, 66.63, 53.47, 4.33, 7.79], ["weur", ["United Kingdom", "بريطانيا"], "2024", "F", 8.34, 59.76, 52.79, 2.24, 23.64],
 ["asia", ["India", "الهند"], "2024", "W", 7.29, 65.79, 64.25, 2.10, 6.98], ["asia", ["South Korea", "كوريا الجنوبية"], "2024", "W", 7.75, 66.97, 66.19, 2.10, 15.27], ["asia", ["Indonesia", "إندونيسيا"], "2024", "W", 6.44, 81.42, 81.14, 7.26, 4.86],
 ["nafr", ["Morocco", "المغرب"], "2021", "H", 4.97, 50.86, 35.94, 5.68, 4.18], ["nafr", ["Tunisia", "تونس"], "2022–23", "H", 4.71, 11.40, 10.61, null, null], ["nafr", ["Algeria", "الجزائر"], "2026", "A", 3.55, 21.24, null, null, null], ["nafr", ["Egypt", "مصر"], "2020", "A", 2.79, 29.07, 28.82, null, null],
 ["amer", ["United States", "الولايات المتحدة"], "2024", "W", 7.85, 64.47, 59.17, 2.00, 1.01], ["amer", ["Canada", "كندا"], "2025", "F", 8.69, 68.70, 61.28, 2.36, 5.01], ["amer", ["Brazil", "البرازيل"], "2022", "W", 6.49, 79.20, 73.42, 9.91, 3.53]];
const CM = [["cDemo", 4, v => num(v, 2), 10], ["cReg", 5, v => num(v, 1) + "%", 100], ["cVap", 6, v => num(v, 1) + "%", 100], ["cEnp", 7, v => num(v, 2), null], ["cLsq", 8, v => num(v, 2), null]];
const lang = AR ? 1 : 0;
function drawCtx() {
  const m = CM[+document.getElementById("ctxsel").value], W = 720, L = 190, R = 70, rh = 24, max = m[3] || Math.max(...BENCH.map(b => b[m[1]] || 0)) * 1.05; let y = 4, s = "", last = "";
  BENCH.forEach(b => { if (b[0] !== last) { last = b[0]; y += 8; s += `<text x="${L - 10}" y="${y + 11}" text-anchor="end" style="font-size:11.5px;letter-spacing:.04em">${esc(REGN[b[0]][lang]).toUpperCase()}</text>`; y += 20; }
    const v = b[m[1]], mo = b[1][0] === "Morocco", w = v == null ? 0 : Math.max(1, (W - L - R) * v / max);
    s += `<g class="row"${tipAttr(`<b>${esc(b[1][lang])} · ${b[2]}</b>${t(m[0])}: ${v == null ? t("na") : m[2](v)}<br>${REGIME[b[3]][lang]} (${num(b[4], 2)})`)}><rect class="hit" x="0" y="${y - 3}" width="${W}" height="${rh}"/><text class="lbl" x="${L - 10}" y="${y + 13}" text-anchor="end"${mo ? ' style="fill:var(--plum)"' : ""}>${esc(b[1][lang])}</text>` +
      (v == null ? `<text x="${L + 2}" y="${y + 13}">${t("na")}</text>` : `<rect class="hl" x="${L}" y="${y}" width="${w}" height="16" rx="3" fill="${mo ? "var(--plum)" : "var(--neutral)"}"/><text class="val" x="${L + w + 7}" y="${y + 13}">${m[2](v)}</text>`) + `</g>`; y += rh; });
  document.getElementById("ctxfig").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${y + 6}" role="img" aria-label="${esc(t(m[0]))}">${s}</svg>`;
}
before(ohLast, `<h2>${t("ctxH")}</h2><p>${t("ctxP")}</p><div class="ctrl"><label for="ctxsel">${t("ctxSel")}</label><select id="ctxsel">${CM.map((m, i) => `<option value="${i}"${i === 2 ? " selected" : ""}>${t(m[0])}</option>`).join("")}</select></div><figure id="ctxfig"></figure>
<ul style="max-width:74ch">${[1, 2, 3].map(i => `<li><b>${t("ctxT" + i)}</b> ${t("ctxB" + i)}</li>`).join("")}</ul>
<details><summary>${t("ctxTable")}</summary><div class="scroll"><table><thead><tr><th>${t("country")}</th><th>${t("year")}</th><th>${t("regime")}</th>${CM.map(m => `<th class="num">${t(m[0])}</th>`).join("")}</tr></thead><tbody>${BENCH.map(b => `<tr${b[1][0] === "Morocco" ? ' style="font-weight:600"' : ""}><td>${esc(b[1][lang])}</td><td>${b[2]}</td><td>${REGIME[b[3]][lang]}</td>${CM.map(m => `<td class="num">${b[m[1]] == null ? `<span class="na">${t("na")}</span>` : m[2](b[m[1]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>
<p class="na" style="font-size:13.5px">${t("ctxNote")}</p>`);
drawCtx();
setRace("2011"); drawFlow(); drawParty(); window.__whatIf = (y, d, a, ps) => whatIf(y, d, a, new Set(ps));
document.addEventListener("change", e => { const el = e.target; if (el.classList.contains("x-hemi")) drawHemi(el.dataset.year); if (el.classList.contains("x-map")) drawYearMap(el.dataset.year); if (el.id === "pvparty" || el.id === "pvyear") drawParty(); if (el.id === "ctxsel") drawCtx(); if (el.classList.contains("x-whatsel") || el.classList.contains("x-whatp")) drawWhat(el.dataset.year); });
document.addEventListener("input", e => { if (e.target.classList.contains("x-what")) drawWhat(e.target.dataset.year); });
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; if (b.id === "raceplay") playRace(); if (b.classList.contains("x-raceyear")) { stopRace(); setRace(b.dataset.year); }
  if (b.classList.contains("x-whatreset")) { const y = b.dataset.year; document.getElementById("what-" + y).value = 0; document.getElementById("whatarea-" + y).value = "all"; document.querySelectorAll(`.x-whatp[data-year="${y}"]`).forEach(c => { c.checked = false; }); drawWhat(y); } });
})();
