function pairedBars(rows, color, la, lb){           // rows: {label, a, b, tip}; a = neutral, b = colour
  const W=720, L=64, R=60, rh=36, H=rows.length*rh+34, max=Math.max(...rows.flatMap(r=>[r.a,r.b]))*1.05, x=v=>L+(W-L-R)*v/max;
  const ticks=[0,.1,.2,.3,.4].filter(t=>t<=max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(la)} و${esc(lb)} حسب الحزب">`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="6" y2="${H-26}"/><text x="${x(t)}" y="${H-10}" text-anchor="middle">${t*100}%</text>`});
  rows.forEach((r,i)=>{const y=10+i*rh;
    s+=`<g class="row"${tipAttr(r.tip)}><rect class="hit" x="0" y="${y-4}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-10}" y="${y+16}" text-anchor="end">${RTLi(esc(r.label))}</text>
    <rect class="hl" x="${L}" y="${y}" width="${Math.max(1,x(r.a)-L)}" height="10" rx="3" fill="var(--neutral)"/>
    <rect class="hl" x="${L}" y="${y+12}" width="${Math.max(1,x(r.b)-L)}" height="10" rx="3" fill="${color}"/>
    <text class="val" x="${x(r.b)+6}" y="${y+21}">${r.vb}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--neutral)"></i>${la}</span><span><i style="background:${color}"></i>${lb}</span></div>`;
}
function deltaBars(rows){                           // rows: {label, d, tip}
  if(!rows.length) return `<p class="na">ما كاين حتى حزب تبدلو ليه المقاعد بهاد القاعدة.</p>`;
  const W=720, L=64, rh=28, H=rows.length*rh+16, m=Math.max(...rows.map(r=>Math.abs(r.d)),4), mid=L+(W-L-40)/2, k=((W-L-40)/2-34)/m;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="التغيير فالمقاعد حسب الحزب">`;
  s+=`<line class="axis" x1="${mid}" x2="${mid}" y1="2" y2="${H-6}"/>`;
  rows.forEach((r,i)=>{const y=8+i*rh, w=Math.abs(r.d)*k, pos=r.d>0;
    s+=`<g class="row"${tipAttr(r.tip)}><rect class="hit" x="0" y="${y-4}" width="${W}" height="${rh}"/>
    <text class="lbl" x="${L-10}" y="${y+13}" text-anchor="end">${RTLi(esc(r.label))}</text>
    <rect class="hl" x="${pos?mid+1:mid-w-1}" y="${y}" width="${w}" height="16" rx="3" fill="${pos?"var(--teal)":"var(--plum)"}"/>
    <text class="val" x="${pos?mid+w+7:mid-w-7}" y="${y+13}" text-anchor="${pos?"start":"end"}">${sgn(r.d)}</text></g>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--teal)"></i>كيربح مقاعد</span><span><i style="background:var(--plum)"></i>كيخسر مقاعد</span></div>`;

function simpleBars(rows, color, fmt, opt={}){      // rows: {label, v, tip, c}
  const W=opt.W||720, L=opt.L||170, R=70, rh=opt.rh||28, H=rows.length*rh+10, max=(opt.max||Math.max(...rows.map(r=>r.v||0)))*1.02||1;

  rows.forEach((r,i)=>{const y=6+i*rh, w=r.v==null?0:Math.max(1,(W-L-R)*r.v/max);
    s+=`<g class="row"${tipAttr(r.tip||`<b>${esc(r.label)}</b>${fmt(r.v)}`)}><rect class="hit" x="0" y="${y-4}" width="${W}" height="${rh}"/>

    <text class="val" x="${L+w+7}" y="${y+13}">${fmt(r.v)}</text></g>`});
  return s+`</svg>`;
}
function groupedBars(groups, series, colors, fmt, max){   // groups: {label, vals:[...]}

function dumbbell(rows){                            // rows: {label, a, b, tip}; a = 2016 rule (teal), b = 2021 rule (plum)

const t = (k, o) => { let s = L[k][AR ? 1 : 0]; if (o) for (const a in o) s = s.replace("{" + a + "}", o[a]); return s; };
const tr = s => (typeof T === "function" ? T(s) : s);
const Y = D.years, MAIN = X.main, OTH = "Others";
const PC = Object.fromEntries(MAIN.map((p, i) => [p, `var(--p${i + 1})`]));
const pc = p => PC[p] || "var(--neutral)";
const pname = p => p === OTH ? t("others") : p;
const REG = [[.06, "eligible"], [.03, "eligible"], [0, "registered"], [0, "valid"]];
const cvOf = y => X.cv[y].map(c => ({ name: c[0], prov: c[1], seats: c[2], reg: c[3], voters: c[4], est: c[5], u: c[7], v: c[6], valid: Object.values(c[6]).reduce((a, b) => a + b, 0) }));
const CV = Object.fromEntries(Y.map(y => [y, cvOf(y)]));
const before = (el, html) => el.insertAdjacentHTML("beforebegin", html);

/* seat allocation: largest remainder, same logic as the notebook */
function allocate(votes, seats, thr, basis, registered) {
  const valid = Object.values(votes).reduce((a, b) => a + b, 0);
  const el = Object.entries(votes).filter(([, v]) => thr > 0 ? v >= thr * valid : v > 0);
  const out = {}; if (!el.length || seats <= 0) return out;
  const base = basis === "eligible" ? el.reduce((a, [, v]) => a + v, 0) : basis === "valid" ? valid : (registered || valid), q = base / seats;
  let full = el.map(([p, v]) => [p, Math.floor(v / q), v]), sum = full.reduce((a, f) => a + f[1], 0);
  if (sum > seats) { full = full.map(f => [f[0], Math.floor(f[1] * seats / sum), f[2]]); sum = full.reduce((a, f) => a + f[1], 0); }
  full.map(f => [f, f[2] - f[1] * q]).sort((a, b) => b[1] - a[1]).slice(0, seats - sum).forEach(([f]) => f[1]++);
  full.forEach(f => { if (f[1]) out[f[0]] = f[1]; }); return out;
}
const cache = {};
function seatsFor(y, ri, regFn) {
  const key = y + "|" + ri; if (!regFn && cache[key]) return cache[key];
  const by = {}, tot = {};
  CV[y].forEach(c => { const a = allocate(c.v, c.seats, REG[ri][0], REG[ri][1], regFn ? regFn(c) : c.reg); by[c.name] = a; for (const p in a) tot[p] = (tot[p] || 0) + a[p]; });
  const r = { by, tot }; if (!regFn) cache[key] = r; return r;
}
Y.forEach(y => D.regimes.forEach((g, i) => { const s = seatsFor(y, i).tot; D.eng[y].forEach(r => { if ((s[r.party] || 0) !== r[g]) console.warn("seat check differs from notebook", y, g, r.party, s[r.party] || 0, r[g]); }); }));
const grouped = tot => { const o = {}; for (const p in tot) { const k = PC[p] ? p : OTH; o[k] = (o[k] || 0) + tot[p]; } return o; };
const ordered = g => Object.entries(g).sort((a, b) => (a[0] === OTH) - (b[0] === OTH) || b[1] - a[1]);

/* ---------- hemicycle ---------- */
const hemiCache = {};
function hemiLayout(N) { if (hemiCache[N]) return hemiCache[N];
  const rows = 9, r0 = 110, dr = 22, rad = [...Array(rows)].map((_, i) => r0 + i * dr), tot = rad.reduce((a, b) => a + b, 0);
  const n = rad.map(r => Math.round(N * r / tot)); let diff = N - n.reduce((a, b) => a + b, 0);
  for (let i = rows - 1; diff !== 0; i = (i + rows - 1) % rows) { n[i] += Math.sign(diff); diff -= Math.sign(diff); }
  const pts = []; rad.forEach((r, i) => { for (let j = 0; j < n[i]; j++) { const a = Math.PI - Math.PI * (j + .5) / n[i]; pts.push({ x: 360 + r * Math.cos(a), y: 300 - r * Math.sin(a), a }); } });
  return hemiCache[N] = pts.sort((p, q) => q.a - p.a); }
function hemicycle(tot, label) {
  const g = ordered(grouped(tot)), NS = g.reduce((a, e) => a + e[1], 0), HEMI = hemiLayout(NS); let i = 0, s = `<svg class="chart" viewBox="0 0 720 322" role="img" aria-label="${esc(t("hemiH", { n: NS }))}">`;
  g.forEach(([p, n]) => { for (let k = 0; k < n && i < HEMI.length; k++, i++) s += `<circle cx="${HEMI[i].x.toFixed(1)}" cy="${HEMI[i].y.toFixed(1)}" r="7" fill="${pc(p)}" stroke="var(--bg)" stroke-width="1.5"${tipAttr(`<b>${esc(pname(p))}</b>${num(n)} ${t("seats")}`)}/>`; });
  s += `<text x="360" y="276" text-anchor="middle" style="font:500 40px Newsreader,Georgia,serif;fill:var(--ink)">${label}</text><text x="360" y="298" text-anchor="middle">${esc(pname(g[0][0]))} ${num(g[0][1])} · ${num(g[0][1] / NS * 100, 1)}%</text></svg>`;
  return s + `<div class="chips">${g.map(([p, n]) => `<span><i style="background:${pc(p)}"></i>${esc(pname(p))} <b>${num(n)}</b></span>`).join("")}</div>`;
}

/* ---------- map ---------- */
function provAgg(y) { const o = {}; CV[y].forEach(c => { const p = o[c.prov] || (o[c.prov] = { seats: 0, reg: 0, voters: 0, valid: 0, v: {}, consts: [] }); p.seats += c.seats; p.reg += c.reg; p.voters += c.voters; p.valid += c.valid; p.consts.push(c.name); for (const k in c.v) p.v[k] = (p.v[k] || 0) + c.v[k]; });
  for (const k in o) { const e = Object.entries(o[k].v).sort((a, b) => b[1] - a[1]); o[k].lead = e[0][0]; o[k].leadShare = e[0][1] / o[k].valid; } return o; }

function drawMap(el, y, vals, fmt, cat, tipFn) {       // vals: {province: number | party}

  const bin = v => br.filter(b => v > b).length;

function whatIf(y, delta, area, chosen) {
  const tot = {}, ri = IN_FORCE[y]; let voters = 0, touched = 0;
  CV[y].forEach(c => { let v = c.v, vt = c.voters;
    if (delta && (area === "all" || (area === "urban") === !!c.u)) {
      const t0 = c.voters / c.reg, t1 = Math.min(Math.max(t0 + delta / 100, .02), .98);
      const pool = Object.keys(c.v).filter(p => c.v[p] > 0 && (!chosen.size || chosen.has(p) || (chosen.has(OTH) && !PC[p]))), ps = pool.reduce((a, p) => a + c.v[p], 0);
      if (pool.length) { const extra = Math.max(c.reg * (t1 - t0) * (c.valid / c.voters), -ps); v = { ...c.v }; pool.forEach(p => { v[p] += extra * c.v[p] / ps; }); vt += c.reg * (t1 - t0); touched++; } }
    const a = allocate(v, c.seats, REG[ri][0], REG[ri][1], c.reg); for (const p in a) tot[p] = (tot[p] || 0) + a[p]; voters += vt; });
  return { tot, voters, touched };
}

}

  ["PUD", "حزب الوحدة والديمقراطية", "", "Parti de l'unité et de la démocratie", null, "", "", "2024-10/%D8%AD%D8%B2%D8%A8%20%D8%A7%D9%84%D9%88%D8%AD%D8%AF%D8%A9%20%D9%88%D8%A7%D9%84%D8%AF%D9%8A%D9%85%D9%82%D8%B1%D8%A7%D8%B7%D9%8A%D8%A9.png"],
  ["PSU", "الحزب الاشتراكي الموحد", "", "Parti socialiste unifié", null, "الشمعة", "candle"],
  ["PDI", "حزب الشورى والاستقلال", "", "Parti démocratique de l'indépendance", null, "", "", "2024-10/%D8%AD%D8%B2%D8%A8%20%D8%A7%D9%84%D8%B4%D9%88%D8%B1%D9%89%20%D9%88%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%82%D9%84%D8%A7%D9%84.jpeg"]
 ];
 const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const MAINP = X.main, colour = p => { const i = MAINP.indexOf(p); return i >= 0 ? `var(--p${i + 1})` : "var(--neutral)"; };
 const seats = (y, p) => { const r = (D.seats[y] || []).find(x => x.party === p); return r ? r.seats_local : 0; };
 const Ys = D.years;

 const card = r => {
  const [code, ar, short, fr, sym, symAr, symEn, logo] = r;
  const main = MAINP.includes(code), badge = main ? `<span class="pt-badge" style="background:${colour(code)}">${code}</span>` : `<span class="pt-badge pt-badge-o">${code}</span>`;
  const visual = LOGOS[code]
   ? `<img class="pt-logo" src="${LOGOS[code]}" alt="${esc("لوغو " + ar)}">`
   : sym ? `<span class="pt-sym" role="img" aria-label="${esc(symAr)}">${sym}</span>` : "";
  const st = Ys.map(y => `<span><b>⁦${seats(y, code)}⁩</b> <small>${y}</small></span>`).join("");
  return `<li class="pt-card"><div class="pt-vis">${visual}${badge}</div>
   <div class="pt-txt"><div class="pt-ar">${esc(ar)}</div>
   ${short ? `<div class="pt-short">كيتسمى: ${esc(short)}${symAr ? ` · الرمز: ${esc(symAr)}` : ""}</div>` : ""}
   <div class="pt-fr" dir="ltr" lang="fr">${esc(fr)}${symEn ? ` · symbol: ${esc(symEn)}` : ""}</div>
   <div class="pt-seats" title="المقاعد المحلية">${st}</div></div></li>`;
 };

 const html = `<details class="pt-box" id="parties">
  <summary>الأحزاب المذكورة فاللوحة (${P.length}) <span class="pt-sub">السمية بالعربية، بالفرنسية، والرمز</span></summary>
  <p class="pt-note">الأرقام تحت كل حزب = المقاعد المحلية اللي ربح ف ${Ys.join("، ")}. «بلا انتماء» فجداول الحكومة = وزراء ما عندهم حتى حزب (تقنوقراط).</p>
  <ul class="pt-grid">${P.map(card).join("")}</ul>
  <p class="pt-src">المصدر ديال السميات: البوابة الرسمية maroc.ma (لائحة الأحزاب السياسية). «الرمز» = الرمز الانتخابي اللي كيبان فورقة التصويت. اللوغوهات مدمجين فالملف، وكيبانو حتى بلا إنترنت.</p>
 </details>`;
 const anchor = document.getElementById("hq-intro") || document.querySelector(".lede");
 if (anchor && !document.getElementById("parties")) anchor.insertAdjacentHTML("afterend", html);
})();

</script>
<script id="hq-ui">
(() => {
 const BIDI = /[⁦-⁩‎‏]/g;
 const iso = s => s.replace(/[−+-]?\d[\d.,]*(?:\s?[%×+])?/g, m => "⁦" + m + "⁩");
 const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const ownText = el => { let s = ""; el.childNodes.forEach(n => { if (n.nodeType === 3) s += n.textContent; else if (n.nodeType === 1 && !n.classList.contains("hq") && !/^(SELECT|INPUT|BUTTON)$/.test(n.tagName)) s += n.textContent; }); return s.replace(BIDI, "").replace(/\s+/g, " ").trim(); };

 const card = document.createElement("div");
 card.id = "hq-card"; card.setAttribute("role", "dialog"); card.setAttribute("aria-modal", "false"); card.hidden = true;
 document.body.appendChild(card);
 let openBtn = null;

 const gauge = sc => {
  const span = sc.max - sc.min, pc = v => (v - sc.min) / span * 100, pu = sc.u && sc.u.trim() === "%" ? "%" : "";
  const fmt = v => String(v).replace("-", "−") + pu;
  let from = sc.min;
  const zs = sc.z.map((z, i) => { const r = { a: from, b: z[0], ar: z[1], en: z[2], i: i + 1 }; from = z[0]; return r; });
  const segs = zs.map(z => `<div class="hq-seg" style="width:${pc(z.b) - pc(z.a)}%;background:var(--hq${z.i})"></div>`).join("");
  const ticks = [sc.min, ...sc.z.map(z => z[0])].map((v, k, a) => `<span style="left:${pc(v)}%" class="${k === 0 ? "first" : k === a.length - 1 ? "last" : ""}">${fmt(v)}</span>`).join("");
  const leg = zs.map(z => `<li><i style="background:var(--hq${z.i})"></i><span>من ⁦${fmt(z.a)}⁩ حتى ⁦${fmt(z.b)}⁩: ${esc(z.ar)}</span><span class="en" dir="ltr" lang="en">${fmt(z.a)} to ${fmt(z.b)}: ${esc(z.en)}</span></li>`).join("");
  return `<div class="hq-gauge"><div class="hq-bar" dir="ltr">${segs}</div><div class="hq-ticks" dir="ltr">${ticks}</div><ul class="hq-leg">${leg}</ul></div>`;
 };

 const row = (ico, ar, arTxt, en) => `<div class="hq-row"><div class="hq-h">${ico} ${ar}</div><p>${iso(esc(arTxt))}</p><p class="en" dir="ltr" lang="en">${esc(en)}</p></div>`;

 function show(id, btn) {
  const c = HQ[id]; if (!c) return;
  card.innerHTML = `<button class="hq-x" type="button" aria-label="سد">×</button>
   <div class="hq-t">${iso(esc(c.t))}<span class="en" dir="ltr" lang="en">${esc(c.te)}</span></div>
   ${row("①", "شنو كيقيس", c.w, c.we)}
   <div class="hq-row"><div class="hq-h">② كيفاش تقرا الرقم</div>${c.s ? gauge(c.s) : ""}${c.st ? `<p>${iso(esc(c.st))}</p><p class="en" dir="ltr" lang="en">${esc(c.ste)}</p>` : ""}</div>
   ${row("③", "بحال…", c.l, c.le)}
   ${row("④", "سول راسك", c.q, c.qe)}
   ${c.n ? `<div class="hq-note"><p>${iso(esc(c.n))}</p><p class="en" dir="ltr" lang="en">${esc(c.ne)}</p></div>` : ""}
   <div class="hq-foot">هاد البطاقة كتعلمك كيفاش تقرا الرقم، ماشي شنو تستنتج.</div>`;
  card.hidden = false; card.scrollTop = 0;
  if (openBtn) openBtn.setAttribute("aria-expanded", "false");
  openBtn = btn; btn.setAttribute("aria-expanded", "true");
  place();
  card.querySelector(".hq-x").focus({ preventScroll: true });
 }
 function hide() { card.hidden = true; if (openBtn) { openBtn.setAttribute("aria-expanded", "false"); openBtn.focus({ preventScroll: true }); openBtn = null; } }
 function place() {
  if (card.hidden || !openBtn) return;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  card.classList.toggle("sheet", vw < 640);
  if (vw < 640) { card.style.left = card.style.top = ""; return; }
  const r = openBtn.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
  let left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), vw - w - 12);
  let top = r.bottom + 8; if (top + h > vh - 12) top = Math.max(12, r.top - h - 8);
  card.style.left = left + "px"; card.style.top = top + "px";
 }
 document.addEventListener("click", e => {
  const b = e.target.closest(".hq");
  if (b) { e.preventDefault(); e.stopPropagation(); if (openBtn === b && !card.hidden) hide(); else show(b.dataset.hq, b); return; }
  if (e.target.closest(".hq-x")) { hide(); return; }
  if (!card.hidden && !card.contains(e.target)) hide();
 }, true);
 document.addEventListener("keydown", e => { if (e.key === "Escape" && !card.hidden) hide(); });
 window.addEventListener("resize", place); window.addEventListener("scroll", () => { if (!card.classList.contains("sheet")) hide(); }, { passive: true });

 const SEL = ".stats > div > span, .lkpi, td, th, h2, h3, label";
 function scan() {
  document.querySelectorAll(SEL).forEach(el => {
   if (el.dataset.hqDone || el.closest("#hq-card")) return;
   el.dataset.hqDone = "1";
   const txt = ownText(el); if (!txt || txt.length > 90) return;
   const hit = HQ_RULES.find(r => r[1].test(txt)); if (!hit) return;
   if (el.tagName === "TD") { // one button per run of identical cells in a column (scorecard test names)
    const tr = el.parentElement, prev = tr.previousElementSibling, i = el.cellIndex;
    if (prev && prev.cells[i] && ownText(prev.cells[i]) === txt) return;
   }
   const b = document.createElement("button");
   b.type = "button"; b.className = "hq"; b.dataset.hq = hit[0]; b.textContent = "؟";
   b.setAttribute("aria-label", "كيفاش تقرا: " + HQ[hit[0]].t); b.setAttribute("aria-expanded", "false"); b.title = "كيفاش تقرا هاد المؤشر";
   if (el.tagName === "LABEL") el.insertAdjacentElement("afterend", b); else el.appendChild(b);
  });
 }
 let pend = 0;
 new MutationObserver(() => { if (!pend) pend = requestAnimationFrame(() => { pend = 0; scan(); }); }).observe(document.body, { childList: true, subtree: true });
 scan();

 const lede = document.querySelector(".lede");
 if (lede && !document.getElementById("hq-intro")) lede.insertAdjacentHTML("afterend", `<p id="hq-intro" class="hq-intro">كليكي على <span class="hq-demo" aria-hidden="true">؟</span> حدا أي مؤشر باش تعرف كيفاش تقراه: شنو كيقيس، السلم ديالو، تشبيه من الحياة، وسؤال تسولو لراسك.</p>`);
})();

</script>
</body></html>
